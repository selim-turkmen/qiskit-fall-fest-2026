<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- These static tags are what social networks and search engines read.
       Keep them in sync with content.js (title / description / dates). -->
  <title>Qiskit Fall Fest 2026 · Sabancı University</title>
  <meta name="description" content="Qiskit Fall Fest 2026 at Sabancı University, organized by QSB|SU: quantum computing workshops, talks and a hands-on Qiskit hackathon. Free registration.">
  <meta name="theme-color" content="#0b0a1a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Qiskit Fall Fest 2026 · Sabancı University">
  <meta property="og:description" content="Quantum computing workshops, talks and a hands-on Qiskit hackathon at Sabancı University. Organized by QSB|SU. Free registration.">
  <!-- Social networks need an absolute URL here. After deploying, replace with e.g.
       https://<owner>.github.io/<repo>/assets/img/og-image.png -->
  <meta property="og:image" content="assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <noscript>
      <div class="error-box">This site needs JavaScript to display the program and registration form. / Bu site programı ve kayıt formunu göstermek için JavaScript'e ihtiyaç duyar.</div>
    </noscript>
  </div>

  <!-- 1) All editable content -->
  <script src="content.js"></script>
  <!-- 2) The renderer -->
  <script src="assets/js/app.js"></script>
</body>
</html>
